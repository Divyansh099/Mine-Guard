<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineGuard — AI-Powered Coal Mine Governance &amp; Compliance</title>
<style>
:root{
  --mg-primary:#4A2BC2; --mg-primary-hover:#3C21A3; --mg-primary-active:#311A87;
  --mg-primary-soft:#EDE9FB; --mg-primary-border:#C9BEF2;

  --mg-danger:#B3261E; --mg-danger-bg:#FCEBEA; --mg-danger-border:#F0B4AF;

  --mg-info:#0B5FA5; --mg-info-bg:#E7F1FA; --mg-info-border:#A6C9E6;
  --mg-font:"Noto Sans","Noto Sans Devanagari","Segoe UI",Roboto,Arial,sans-serif;
  --mg-fs-xs:11px; --mg-fs-sm:12px; --mg-fs-base:13.5px; --mg-fs-md:15px;
  --mg-fs-lg:18px; --mg-fs-xl:22px; --mg-fs-2xl:28px; --mg-fs-3xl:34px;
  --mg-lh-tight:1.25; --mg-lh-normal:1.5;
  --mg-s1:4px; --mg-s2:8px; --mg-s3:12px; --mg-s4:16px; --mg-s5:20px;
  --mg-s6:24px; --mg-s8:32px; --mg-s10:40px; --mg-s12:48px;
  --mg-r-sm:4px; --mg-r-md:8px; --mg-r-lg:12px; --mg-r-pill:999px;
  --mg-e1:0 1px 2px rgba(15,26,52,.08); --mg-e2:0 2px 6px rgba(15,26,52,.10);
  --mg-e3:0 8px 24px rgba(15,26,52,.16);

  --mg-sidebar-w:246px; --mg-topbar-h:58px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--mg-font);font-size:var(--mg-fs-base);line-height:var(--mg-lh-normal);color:var(--mg-text);background:var(--mg-bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{color:var(--mg-navy);margin:0;line-height:var(--mg-lh-tight);font-weight:700}
h1{font-size:var(--mg-fs-2xl)} h2{font-size:var(--mg-fs-xl)} h3{font-size:var(--mg-fs-lg)} h4{font-size:var(--mg-fs-md)}
p{margin:0 0 var(--mg-s3)}
a{color:var(--mg-primary);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:none;box-shadow:var(--mg-focus);border-radius:var(--mg-r-sm)}
.mg-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mg-skip{position:absolute;left:-999px;top:0;z-index:9999;background:var(--mg-primary);color:#fff;padding:var(--mg-s3) var(--mg-s4);border-radius:0 0 var(--mg-r-md) 0}
.mg-skip:focus{left:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--mg-s2);min-height:34px;padding:0 var(--mg-s4);font-size:var(--mg-fs-base);font-weight:600;line-height:1;border-radius:var(--mg-r-md);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn--primary{background:var(--mg-primary);color:#fff;border-color:var(--mg-primary)}
.btn--primary:hover:not(:disabled){background:var(--mg-primary-hover)}
.btn--secondary{background:var(--mg-surface);color:var(--mg-navy);border-color:var(--mg-border-strong)}
.btn--secondary:hover:not(:disabled){background:var(--mg-surface-alt);border-color:var(--mg-primary);color:var(--mg-primary)}
.btn--ghost{background:transparent;color:var(--mg-navy);border-color:transparent}

.btn--danger{background:var(--mg-danger);color:#fff;border-color:var(--mg-danger)}
.btn--success{background:var(--mg-success);color:#fff;border-color:var(--mg-success)}

.btn-row{display:flex;flex-wrap:wrap;gap:var(--mg-s2);align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px var(--mg-s2);border-radius:var(--mg-r-pill);font-size:var(--mg-fs-xs);font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.7;border:1px solid transparent;white-space:nowrap}
.badge--low{background:var(--mg-success-bg);color:var(--mg-success);border-color:var(--mg-success-border)}

.badge--high{background:var(--mg-danger-bg);color:var(--mg-danger);border-color:var(--mg-danger-border)}
.badge--critical{background:var(--mg-critical);color:#fff;border-color:var(--mg-critical)}

.badge--info{background:var(--mg-info-bg);color:var(--mg-info);border-color:var(--mg-info-border)}
.badge--success{background:var(--mg-success-bg);color:var(--mg-success);border-color:var(--mg-success-border)}
.badge--warning{background:var(--mg-warning-bg);color:var(--mg-warning);border-color:var(--mg-warning-border)}
.badge--danger{background:var(--mg-danger-bg);color:var(--mg-danger);border-color:var(--mg-danger-border)}

.card{background:var(--mg-surface);border:1px solid var(--mg-border);border-radius:var(--mg-r-lg);box-shadow:var(--mg-e1)}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:var(--mg-s3);padding:var(--mg-s3) var(--mg-s4);border-bottom:1px solid var(--mg-border);flex-wrap:wrap}

.card__body{padding:var(--mg-s4)}
.card__body--flush{padding:0}
.card__foot{padding:var(--mg-s3) var(--mg-s4);border-top:1px solid var(--mg-border);background:var(--mg-surface-alt);border-radius:0 0 var(--mg-r-lg) var(--mg-r-lg)}
.grid{display:grid;gap:var(--mg-s4)}
.grid--kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.grid--2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid--3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid--4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpi{background:var(--mg-surface);border:1px solid var(--mg-border);border-radius:var(--mg-r-lg);padding:var(--mg-s4);box-shadow:var(--mg-e1);display:flex;flex-direction:column;gap:var(--mg-s1);min-height:112px;text-align:left}
button.kpi{cursor:pointer;font-family:inherit;transition:border-color .12s,box-shadow .12s}
button.kpi:hover{border-color:var(--mg-primary-border);box-shadow:var(--mg-e2)}
.kpi__label{font-size:var(--mg-fs-sm);font-weight:600;color:var(--mg-text-muted);text-transform:uppercase;letter-spacing:.03em}
.kpi__value{font-size:var(--mg-fs-3xl);font-weight:700;color:var(--mg-navy);line-height:1.1}
.kpi__meta{font-size:var(--mg-fs-sm);color:var(--mg-text-muted);margin-top:auto}
.kpi__value--danger{color:var(--mg-danger)} .kpi__value--warning{color:var(--mg-warning)}
.kpi__value--success{color:var(--mg-success)} .kpi__value--info{color:var(--mg-info)}
.tw{overflow-x:auto;max-width:100%}
table.dt{width:100%;border-collapse:collapse;font-size:var(--mg-fs-base)}
table.dt th{text-align:left;font-size:var(--mg-fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mg-text-muted);background:var(--mg-surface-alt);padding:var(--mg-s2) var(--mg-s3);border-bottom:1px solid var(--mg-border);white-space:nowrap}
table.dt td{padding:var(--mg-s3);border-bottom:1px solid var(--mg-border);vertical-align:top;color:var(--mg-text)}
table.dt tbody tr:hover{background:var(--mg-surface-alt)}
.td-strong{font-weight:600;color:var(--mg-navy)} .td-muted{color:var(--mg-text-muted);font-size:var(--mg-fs-sm)}
.field{display:flex;flex-direction:column;gap:var(--mg-s1);margin-bottom:var(--mg-s3)}
.field label{font-size:var(--mg-fs-sm);font-weight:600;color:var(--mg-navy)}
.field .hint{font-size:var(--mg-fs-xs);color:var(--mg-text-muted)}
.field .err{font-size:var(--mg-fs-xs);color:var(--mg-danger);font-weight:600;display:none}
.field.is-invalid .err{display:block}
.field.is-invalid input,.field.is-invalid select,.field.is-invalid textarea{border-color:var(--mg-danger)}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=number],select,textarea{font-family:inherit;font-size:var(--mg-fs-base);color:var(--mg-text);background:var(--mg-surface);border:1px solid var(--mg-border-strong);border-radius:var(--mg-r-md);padding:var(--mg-s2) var(--mg-s3);min-height:34px;width:100%}

.filterbar .field{margin-bottom:0;min-width:150px;flex:1 1 150px}
.check{display:flex;align-items:center;gap:var(--mg-s2);font-size:var(--mg-fs-base);cursor:pointer}

.login-brand{background:var(--mg-navy);color:#fff;padding:var(--mg-s12) var(--mg-s10);display:flex;flex-direction:column;justify-content:center;gap:var(--mg-s6)}

.login-mark{display:flex;align-items:center;gap:var(--mg-s3)}

.cred-grid button:hover{text-decoration:underline}
.app{min-height:100vh}

.navitem{display:flex;align-items:center;gap:var(--mg-s3);width:100%;background:transparent;border:none;border-left:3px solid transparent;color:var(--mg-sidebar-text);font-size:var(--mg-fs-base);font-weight:500;font-family:inherit;padding:var(--mg-s2) var(--mg-s3);cursor:pointer;text-align:left;border-radius:0 var(--mg-r-sm) var(--mg-r-sm) 0}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}

.sidebar__foot{padding:var(--mg-s3);border-top:1px solid rgba(255,255,255,.10)}
.userbox{display:flex;align-items:center;gap:var(--mg-s2);margin-bottom:var(--mg-s2)}

.userbox__txt strong{display:block;color:#fff;font-size:var(--mg-fs-sm)}
.userbox__txt span{display:block;color:#93A0B8;font-size:var(--mg-fs-xs)}
.sidebar__offline{display:flex;align-items:center;gap:var(--mg-s2);font-size:var(--mg-fs-xs);color:#FFD9A0;background:rgba(161,92,0,.22);border:1px solid rgba(239,203,146,.35);border-radius:var(--mg-r-sm);padding:var(--mg-s1) var(--mg-s2);margin-bottom:var(--mg-s2)}
.main{margin-left:var(--mg-sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--mg-topbar-h);background:var(--mg-surface);border-bottom:1px solid var(--mg-border);display:flex;align-items:center;gap:var(--mg-s3);padding:0 var(--mg-s4)}
.topbar__menu{display:none}

.searchresults{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:420px;overflow-y:auto;background:var(--mg-surface);border:1px solid var(--mg-border-strong);border-radius:var(--mg-r-md);box-shadow:var(--mg-e3);z-index:60}

.topbar__spacer{flex:1}

.topbar__btn:hover{background:var(--mg-surface-alt);border-color:var(--mg-border)}
.topbar__dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:var(--mg-r-pill);background:var(--mg-danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--mg-surface)}
.netpill{display:inline-flex;align-items:center;gap:5px;font-size:var(--mg-fs-xs);font-weight:700;padding:3px var(--mg-s2);border-radius:var(--mg-r-pill);border:1px solid transparent;cursor:pointer;background:var(--mg-success-bg);color:var(--mg-success);border-color:var(--mg-success-border);font-family:inherit}

.content{flex:1;padding:var(--mg-s6);max-width:1560px;width:100%}
.pageheader{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--mg-s4);margin-bottom:var(--mg-s4);flex-wrap:wrap}

.toast--success{background:var(--mg-success-bg);border-color:var(--mg-success-border);color:#12562B}
.toast--error{background:var(--mg-danger-bg);border-color:var(--mg-danger-border);color:#7A1810}

var STORE_KEY = "mineguard.state.v1";
var SESSION_KEY = "mineguard.session.v1";
var STATE = null;
var SESSION = null;

function loadState(){
  var raw = null;
  try { raw = window.localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  if(!raw){ STATE = seedData(); saveState(); return; }
  try {
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") throw new Error("bad shape");
    var base = seedData();
    Object.keys(base).forEach(function(k){ if(!Array.isArray(parsed[k])) parsed[k] = base[k]; });
    STATE = parsed;
  } catch(e){
    STATE = seedData();
    saveState();
    toast("Saved demo data could not be read. Seed data has been restored.","warning");
  }
}
function saveState(){
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch(e){}
}
function loadSession(){
  try {
    var raw = window.sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !s.userId || !s.role) return null;
    return s;
  } catch(e){ return null; }
}
function saveSession(){
  try {
    if(SESSION) window.sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
    else window.sessionStorage.removeItem(SESSION_KEY);
  } catch(e){}
}

var RISK_THRESHOLDS = { critical:75, high:50, medium:25 };
function riskLevelFromScore(score){
  if(score >= RISK_THRESHOLDS.critical) return "CRITICAL";
  if(score >= RISK_THRESHOLDS.high) return "HIGH";
  if(score >= RISK_THRESHOLDS.medium) return "MEDIUM";
  return "LOW";
}
function severityWeight(v){ return v==="Critical"?18 : v==="High"?12 : v==="Medium"?7 : 3; }
function alertWeight(v){ return v==="Critical"?15 : v==="High"?10 : v==="Medium"?5 : 2; }
function computeRisk(mineId){
  var mine = getMine(mineId);
  if(!mine) return { score:0, level:"LOW", factors:[], direction:"Stable", window:"Next 14 days", openViolations:0, openAlerts:0, openActions:0, overdueActions:0 };
  var openViolations = arr(STATE.violations).filter(function(v){ return normId(v.mineId)===normId(mineId) && v.status!=="Closed"; });
  var openAlerts = arr(STATE.alerts).filter(function(a){ return normId(a.mineId)===normId(mineId) && a.status!=="Resolved"; });
  var openActions = arr(STATE.correctiveActions).filter(function(c){ return normId(c.mineId)===normId(mineId) && c.status!=="Completed"; });
  var overdueActions = openActions.filter(function(c){ return c.status==="Overdue" || isOverdue(c.deadline); });
  var openInspections = arr(STATE.inspections).filter(function(i){ return normId(i.mineId)===normId(mineId) && i.status!=="Completed"; });
  var score = 0, factors = [];
  openViolations.forEach(function(v){ score += severityWeight(v.severity); });
  if(openViolations.length) factors.push(openViolations.length+" open violation(s)");
  openAlerts.forEach(function(a){ score += alertWeight(a.severity); });
  if(openAlerts.length) factors.push(openAlerts.length+" unresolved alert(s)");
  score += overdueActions.length * 8;
  if(overdueActions.length) factors.push(overdueActions.length+" overdue corrective action(s)");
  score += openInspections.length * 2;
  if(openInspections.length) factors.push(openInspections.length+" inspection(s) not completed");
  var rec = openViolations.filter(function(v){ return v.recurrence; }).length;
  if(rec){ score += rec*4; factors.push(rec+" recurring violation(s)"); }
  score = clamp(Math.round(score), 0, 100);
  var level = riskLevelFromScore(score);
  var direction = "Stable";
  if(overdueActions.length >= 2 || openAlerts.some(function(a){ return a.severity==="Critical"; })) direction = "Worsening";
  else if(openViolations.length === 0 && openActions.length === 0) direction = "Improving";
  return { score:score, level:level, factors:factors, direction:direction, window:"Next 14 days", openViolations:openViolations.length, openAlerts:openAlerts.length, openActions:openActions.length, overdueActions:overdueActions.length };
}
function recalcMineRisk(mineId){ var mine = getMine(mineId); if(!mine) return; var r = computeRisk(mineId); mine.riskScore = r.score; mine.riskLevel = r.level; }
function recalcAllRisk(){ arr(STATE.mines).forEach(function(m){ recalcMineRisk(m.id); }); }
function computeCompliance(mineId){
  var ov = arr(STATE.violations).filter(function(v){ return normId(v.mineId)===normId(mineId) && v.status!=="Closed"; }).length;
  var od = arr(STATE.correctiveActions).filter(function(c){ return normId(c.mineId)===normId(mineId) && c.status!=="Completed" && (c.status==="Overdue"||isOverdue(c.deadline)); }).length;
  var ed = arr(STATE.documents).filter(function(d){ return normId(d.mineId)===normId(mineId) && d.status==="Expired"; }).length;
  var ii = arr(STATE.inspections).filter(function(i){ return normId(i.mineId)===normId(mineId) && i.status!=="Completed"; }).length;
  var cExp = arr(STATE.certifications).filter(function(c){ var con = getContractor(c.contractorId); return con && normId(con.mineId)===normId(mineId) && daysUntil(c.expiryDate)!==null && daysUntil(c.expiryDate)<0; }).length;
  return clamp(Math.round(100 - ov*6 - od*5 - ed*4 - ii*2 - cExp*4), 0, 100);
}
function complianceBand(score){ if(score>=85) return {label:"Good",cls:"success"}; if(score>=70) return {label:"Fair",cls:"warning"}; return {label:"Needs Attention",cls:"danger"}; }
function riskBadge(level){ var map = { LOW:"low", MEDIUM:"medium", HIGH:"high", CRITICAL:"critical" }; return '<span class="badge badge--'+(map[level]||"neutral")+'">'+esc(level)+'</span>'; }
function statusBadge(status){
  var map = { "Open":"danger","Closed":"success","Under Review":"warning","Unacknowledged":"danger","Acknowledged":"warning","Resolved":"success","Pending":"neutral","In Progress":"info","Overdue":"danger","Completed":"success","Scheduled":"info","Valid":"success","Expired":"danger","Expiring Soon":"warning","Operating":"success","Maintenance":"warning","verified":"success","rejected":"danger","pending":"warning","Not Submitted":"neutral","Submitted":"info","Imported":"primary" };
  return '<span class="badge badge--'+(map[status]||"neutral")+'">'+esc(status)+'</span>';
}

}

var modalState = { open:false, trigger:null };
function openModal(opts){
  var root = byId("modal-root");
  modalState.trigger = document.activeElement;
  var wide = opts.wide ? " modal--wide" : "";
  root.innerHTML = '<div class="modal-overlay" data-act="modal-backdrop"><div class="modal'+wide+'" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal__head"><div><h2 id="modal-title">'+esc(opts.title)+'</h2>'+(opts.subtitle?'<p class="card__sub">'+esc(opts.subtitle)+'</p>':'')+'</div><button type="button" class="modal__close" data-act="modal-close" aria-label="Close dialog">'+icon("close",18)+'</button></div><div class="modal__body" id="modal-body">'+(opts.body||"")+'</div>'+(opts.footer?'<div class="modal__foot">'+opts.footer+'</div>':'')+'</div></div>';
  modalState.open = true;
  var first = root.querySelector("input,select,textarea,button.btn--primary,button");
  if(first) first.focus();
  document.addEventListener("keydown", modalKeydown, true);
}
function closeModal(){
  var root = byId("modal-root");
  if(root) root.innerHTML = "";
  modalState.open = false;
  document.removeEventListener("keydown", modalKeydown, true);
  if(modalState.trigger && modalState.trigger.focus){ try{ modalState.trigger.focus(); }catch(e){} }
  modalState.trigger = null;
}
function modalKeydown(e){
  if(!modalState.open) return;
  if(e.key === "Escape"){ e.preventDefault(); closeModal(); return; }
  if(e.key === "Tab"){
    var root = byId("modal-root");
    var focusables = root ? root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])') : [];
    if(!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
}
function confirmDialog(title, message, confirmLabel, onConfirm, danger){

}

function downloadBlob(content, filename, mime){
  try{
    var blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return { ok:true };
  } catch(e){ return { ok:false, error:"This browser could not create the download." }; }
}
function toCSV(headers, rows){
  function cell(v){ var s = (v===null||v===undefined)?"":String(v); if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"'; return s; }
  var out = [headers.map(cell).join(",")];
  rows.forEach(function(r){ out.push(r.map(cell).join(",")); });
  return out.join("\r\n");
}

function initials(name){ return String(name||"?").split(/\s+/).filter(Boolean).map(function(p){ return p[0]; }).slice(0,2).join("").toUpperCase(); }

function pageHeader(title, subtitle, actions){

function breadcrumbs(items){
  return '<div class="breadcrumbs no-print">'+items.map(function(it,i){

    return '<button type="button" data-act="nav" data-view="'+esc(it.view)+'"'+(it.id?' data-id="'+esc(it.id)+'"':'')+'>'+esc(it.label)+'</button><span aria-hidden="true">/</span>';

function emptyState(title, message, actionHtml){

function table(headers, rows, caption){
  var thead = '<thead><tr>'+headers.map(function(h){ return '<th scope="col">'+esc(h)+'</th>'; }).join("")+'</tr></thead>';
  var tbody = rows.length ? '<tbody>'+rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join("")+'</tr>'; }).join("")+'</tbody>' : '<tbody><tr><td colspan="'+headers.length+'" class="td-muted" style="text-align:center;padding:24px">No records match the current filters.</td></tr></tbody>';

function renderView(){
  var v = STATE.view;
  if(v === "dashboard") return renderDashboard();
  if(v === "mines") return renderMines();
  if(v === "mine-detail") return renderMineDetail(STATE.params.id);
  if(v === "inspections") return renderInspections();
  if(v === "inspection-run") return renderInspectionRun(STATE.params.id);
  if(v === "violations") return renderViolations();
  if(v === "alerts") return renderAlerts();

  if(v === "contractors") return renderContractors();
  if(v === "contractor-detail") return renderContractorDetail(STATE.params.id);
  if(v === "certifications") return renderCertifications();
  if(v === "compliance") return renderCompliance();
  if(v === "reports") return renderReports();
  if(v === "documents") return renderDocuments();

function renderDashboard(){
  var r = SESSION.role;

function kpi(label, value, meta, cls, nav){

  return '<div class="kpi">'+inner+'</div>';
}
function riskMeterRow(level, score){

function recentActivity(limit){ return arr(STATE.audit).slice(0, limit || 6); }

function dashContractor(){
  var me = contractorRecord();
  var myActions = arr(STATE.correctiveActions).filter(function(c){ return ownsContractor(c.responsible); });
  var openActions = myActions.filter(function(c){ return c.status!=="Completed"; });
  var myViolations = arr(STATE.violations).filter(function(v){ return ownsContractor(v.responsible) && v.status!=="Closed"; });
  var myEvidence = arr(STATE.evidence).filter(function(e){ return ownsContractor(e.submittedBy); });
  var awaiting = myEvidence.filter(function(e){ return e.verificationStatus==="pending"; });
  var myCerts = arr(STATE.certifications).filter(function(c){ return ownsContractor(c.contractorId); });
  var expiring = myCerts.filter(function(c){ var d=daysUntil(c.expiryDate); return d!==null && d<=90; });
  var compliance = me ? computeCompliance(me.mineId) : 0;
  var alertBox = expiring.length ? '<div class="alertbox alertbox--warning">'+icon("alert",18)+'<div><strong>Certification attention required</strong>'+expiring.map(function(c){ var d=daysUntil(c.expiryDate); return esc(c.name)+' \u2014 '+(d<0?Math.abs(d)+' days expired':'expires in '+d+' days'); }).join(" \u00b7 ")+'</div></div>' : '';
  var actionRows = myActions.slice(0,6).map(function(c){
    var ev = evidenceForAction(c.id);
    var verified = ev.some(function(e){ return e.verificationStatus==="verified"; });
    var d = daysUntil(c.deadline);
    return ['<span class="td-strong">'+esc(c.id)+'</span><div class="td-muted">'+esc(c.requiredAction.slice(0,50))+'&hellip;</div>','<span class="td-muted">'+esc(getMineName(c.mineId))+'</span>','<span class="nowrap">'+esc(fmtDate(c.deadline))+'</span>'+(d!==null&&d<0?'<div class="tiny" style="color:var(--mg-danger)">'+Math.abs(d)+' d overdue</div>':''),statusBadge(c.status), verified ? '<span class="badge badge--success">Verified</span>' : ev.length ? '<span class="badge badge--info">Submitted</span>' : '<span class="badge badge--neutral">Not Submitted</span>'];
  });

function renderMines(){
  var f = STATE.filters.mines || (STATE.filters.mines = { q:"", risk:"", status:"" });
  var list = arr(STATE.mines).filter(function(m){
    if(f.q){
      var q = f.q.toLowerCase();
      var hay = (m.id+" "+m.name+" "+m.operator+" "+m.district+" "+m.state).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    if(f.risk === "high" && !(m.riskLevel==="HIGH"||m.riskLevel==="CRITICAL")) return false;
    if(f.risk && f.risk !== "high" && m.riskLevel !== f.risk) return false;
    if(f.status && m.status !== f.status) return false;
    return true;
  });
  var rows = list.map(function(m){
    var comp = computeCompliance(m.id);
    var v = arr(STATE.violations).filter(function(x){ return normId(x.mineId)===normId(m.id) && x.status!=="Closed"; }).length;
    var a = arr(STATE.alerts).filter(function(x){ return normId(x.mineId)===normId(m.id) && x.status!=="Resolved"; }).length;
    var c = arr(STATE.correctiveActions).filter(function(x){ return normId(x.mineId)===normId(m.id) && x.status!=="Completed"; }).length;
    return ['<span class="td-strong">'+esc(m.id)+'</span>','<button type="button" class="btn btn--ghost btn--sm" data-act="nav" data-view="mine-detail" data-id="'+esc(m.id)+'">'+esc(m.name)+'</button><div class="td-muted">'+esc(m.district)+', '+esc(m.state)+' &middot; '+esc(m.type)+'</div>','<span class="td-muted">'+esc(m.operator)+'</span>',riskBadge(m.riskLevel||"LOW"),'<span class="td-strong">'+esc(m.riskScore||0)+'</span>','<span class="badge badge--'+complianceBand(comp).cls+'">'+comp+'%</span>',v?'<strong style="color:var(--mg-danger)">'+v+'</strong>':'<span class="td-muted">0</span>',a?'<strong style="color:var(--mg-warning)">'+a+'</strong>':'<span class="td-muted">0</span>',c?'<strong>'+c+'</strong>':'<span class="td-muted">0</span>','<button type="button" class="btn btn--secondary btn--sm" data-act="nav" data-view="mine-detail" data-id="'+esc(m.id)+'">Open</button>'];
  });
  var riskOpts = ["CRITICAL","HIGH","MEDIUM","LOW"].map(function(r){ return '<option value="'+esc(r)+'"'+(f.risk===r?" selected":"")+'>'+esc(r)+'</option>'; }).join("");
  return pageHeader("Mines","Governed coal mine records with risk and compliance posture",

    '<div class="filterbar no-print">'+
      '<div class="field"><label for="f-mines-q">Search</label><input type="text" id="f-mines-q" data-filterkey="mines.q" value="'+esc(f.q)+'" placeholder="Name, operator, district&hellip;"></div>'+
      '<div class="field"><label for="f-mines-risk">Risk level</label><select id="f-mines-risk" data-filterkey="mines.risk"><option value="">All risk levels</option>'+riskOpts+'<option value="high"'+(f.risk==="high"?" selected":"")+'>High &amp; Critical only</option></select></div>'+
      '<div class="field"><label for="f-mines-status">Status</label><select id="f-mines-status" data-filterkey="mines.status"><option value="">All statuses</option>'+
        ["Operating","Maintenance"].map(function(s){ return '<option value="'+esc(s)+'"'+(f.status===s?" selected":"")+'>'+esc(s)+'</option>'; }).join("")+
      '</select></div>'+
      '<button type="button" class="btn btn--secondary" data-act="clear-mine-filters">Clear</button>'+
    '</div>'+
    '<div class="card"><div class="card__body card__body--flush">'+table(["Mine ID","Mine name","Owner / Operator","Risk","Risk score","Compliance","Violations","Alerts","Actions",""], rows, "Mine listing")+'</div></div>';
}

function renderInspections(){
  var canCreate = can("inspections.create") || can("inspections.assign");
  var rows = arr(STATE.inspections).map(function(i){
    var d = daysUntil(i.scheduledFor);
    var overdue = i.status!=="Completed" && d!==null && d<0;
    var action;
    if(i.status === "Completed") action = '<span class="badge badge--success">Completed</span>';
    else if(can("inspections.perform")) action = '<button type="button" class="btn btn--primary btn--sm" data-act="start-inspection" data-id="'+esc(i.id)+'">'+(i.status==="In Progress"?"Continue":"Start")+'</button>';
    else action = '<span class="td-muted small">Assigned</span>';
    return ['<span class="td-strong">'+esc(i.id)+'</span>','<button type="button" class="btn btn--ghost btn--sm" data-act="nav" data-view="mine-detail" data-id="'+esc(i.mineId)+'">'+esc(getMineName(i.mineId))+'</button>','<span class="td-muted">'+esc(i.type)+'</span>',esc(i.assignedTo),'<span class="nowrap">'+esc(fmtDate(i.scheduledFor))+'</span>'+(overdue?'<div class="tiny" style="color:var(--mg-danger)">'+Math.abs(d)+' d overdue</div>':''),statusBadge(i.priority),statusBadge(overdue?"Overdue":i.status),action];
  });
  return pageHeader("Inspections","Scheduled, active and completed field inspections",
      (canCreate ? '<button type="button" class="btn btn--primary" data-act="new-inspection">'+icon("plus",15)+' New Inspection</button>' : '')+
      '<button type="button" class="btn btn--secondary" data-act="export-inspections">'+icon("download",15)+' Export CSV</button>')+

function renderActions(){
  var list = arr(STATE.correctiveActions);
  var filter = STATE.params.filter || "";
  if(SESSION.role === "contractor") list = list.filter(function(c){ return ownsContractor(c.responsible); });
  if(filter.indexOf("status:overdue") === 0) list = list.filter(function(c){ return c.status!=="Completed" && (c.status==="Overdue"||isOverdue(c.deadline)); });
  if(filter.indexOf("evidence:pending") === 0) list = list.filter(function(c){ return evidenceForAction(c.id).some(function(e){ return e.verificationStatus==="pending"; }); });
  if(filter.indexOf("status:open") === 0) list = list.filter(function(c){ return c.status!=="Completed"; });
  var rows = list.map(function(c){
    var d = daysUntil(c.deadline);
    var ev = evidenceForAction(c.id);
    var verified = ev.some(function(e){ return e.verificationStatus==="verified"; });
    var pending = ev.some(function(e){ return e.verificationStatus==="pending"; });
    var evBadge = verified ? '<span class="badge badge--success">Verified</span>' : pending ? '<span class="badge badge--warning">Pending</span>' : ev.length ? '<span class="badge badge--danger">Rejected</span>' : '<span class="badge badge--neutral">None</span>';
    return ['<button type="button" class="btn btn--ghost btn--sm" data-act="open-action" data-id="'+esc(c.id)+'">'+esc(c.id)+'</button>','<span class="td-muted">'+esc(c.problem.slice(0,58))+'&hellip;</span>','<span class="td-muted">'+esc(getMineName(c.mineId))+'</span>',esc(getContractorName(c.responsible)),'<span class="nowrap">'+esc(fmtDate(c.deadline))+'</span>'+(d!==null && d<0 && c.status!=="Completed" ? '<div class="tiny" style="color:var(--mg-danger)">'+Math.abs(d)+' d overdue</div>' : ''),riskBadge(c.severity.toUpperCase()),statusBadge(c.status),evBadge,'<button type="button" class="btn btn--secondary btn--sm" data-act="open-action" data-id="'+esc(c.id)+'">Open</button>'];
  });
  var filterNote = filter ? '<div class="alertbox alertbox--info">'+icon("search",16)+'<div><strong>Filtered view</strong>Showing: '+esc(filter)+' <button type="button" class="btn btn--ghost btn--sm" data-act="clear-filter">Clear filter</button></div></div>' : '';
  return pageHeader("Corrective Actions","Actions raised against violations and alerts, with evidence-verified closure",
      (can("actions.create") ? '<button type="button" class="btn btn--primary" data-act="new-action">'+icon("plus",15)+' Raise Corrective Action</button>' : '')+
      (can("evidence.submit") ? '<button type="button" class="btn btn--secondary" data-act="submit-evidence">'+icon("upload",15)+' Submit Evidence</button>' : '')+
      '<button type="button" class="btn btn--secondary" data-act="export-actions">'+icon("download",15)+' Export CSV</button>')+
    filterNote+
    '<div class="card"><div class="card__body card__body--flush">'+table(["Action","Problem","Mine","Responsible","Deadline","Severity","Status","Evidence",""], rows, "Corrective action list")+'</div></div>';
}

function renderCompliance(){

    var ed = arr(STATE.documents).filter(function(d){ return normId(d.mineId)===normId(m.id) && d.status==="Expired"; }).length;

      kpi("Overdue Actions Impact", String(arr(STATE.correctiveActions).filter(function(c){ return c.status!=="Completed" && isOverdue(c.deadline); }).length), "Weighted at 5 points each")+
      kpi("Inspection Completion", arr(STATE.inspections).filter(function(i){ return i.status==="Completed"; }).length+"/"+arr(STATE.inspections).length, "Completed inspections")+
    '</section>'+
    '<section class="section"><div class="card"><div class="card__head"><h2 class="card__title">Compliance score by mine</h2><span class="muted small">Deterministic score derived from canonical state</span></div><div class="card__body card__body--flush">'+table(["Mine","Open violations","Overdue actions","Expired documents","Incomplete inspections","Compliance","Band"], rows, "Compliance by mine")+'</div></div></section>'+

function saveInspectionDraftFromDOM(insId){
  var items = [];
  var fieldsets = document.querySelectorAll(".chk");
  for(var i=0;i<fieldsets.length;i++){
    var checked = fieldsets[i].querySelector('input[type=radio]:checked');
    var rem = fieldsets[i].querySelector('textarea');
    var qEl = fieldsets[i].querySelector(".chk__q");
    items.push({ q: qEl ? qEl.textContent.replace(/^\d+\.\s*/,"") : "", result: checked ? checked.value : "", remarks: rem ? rem.value : "" });
  }
  var summaryEl = byId("ins-summary");
  var existing = STATE.inspectionDraft && STATE.inspectionDraft.id === insId ? STATE.inspectionDraft : { attachments:[] };
  STATE.inspectionDraft = { id: insId, items: items, summary: summaryEl ? summaryEl.value : "", gps: existing.gps || null, attachments: existing.attachments || [] };
  return STATE.inspectionDraft;
}

function startInspection(insId){
  var guard = requirePermission("inspections.perform");
  if(!guard.ok){ resultFail(guard.error); return; }
  var ins = getInspector(insId);
  if(!ins){ resultFail("That inspection record does not exist."); return; }
  if(ins.status === "Completed"){ resultFail("This inspection is already completed."); return; }
  ins.status = "In Progress";
  if(!STATE.inspectionDraft || STATE.inspectionDraft.id !== ins.id){
    STATE.inspectionDraft = { id:ins.id, items: defaultChecklist(), summary:"", gps:null, attachments:[] };
  }
  addAudit("Started inspection", "Inspection", ins.id, "Success");
  saveState(); navigate("inspection-run", ins.id);
  resultOk("Inspection " + ins.id + " is now in progress.");
}

function submitInspection(insId){
  var guard = requirePermission("inspections.perform");
  if(!guard.ok){ resultFail(guard.error); return; }
  var ins = getInspector(insId);
  if(!ins){ resultFail("That inspection record does not exist."); return; }
  var draft = saveInspectionDraftFromDOM(insId);
  if(!draft.summary || !draft.summary.trim()){
    var f = byId("ins-summary");
    if(f && f.closest){ var ff = f.closest(".field"); if(ff) ff.classList.add("is-invalid"); }
    var errEl = byId("ins-error");
    if(errEl){ errEl.style.display = "flex"; errEl.innerHTML = "<div><strong>Cannot submit yet</strong>Enter an overall inspection summary.</div>"; }
    resultFail("Enter an overall inspection summary before submitting.");
    return;
  }
  var unanswered = draft.items.filter(function(it){ return !it.result; });
  if(unanswered.length){ resultFail("Mark every checklist item before submitting (" + unanswered.length + " remaining)."); return; }
  var fails = draft.items.filter(function(it){ return it.result === "fail"; }).length;
  var warns = draft.items.filter(function(it){ return it.result === "warning"; }).length;
  var findings = draft.items.filter(function(it){ return it.result === "fail" || it.result === "warning"; }).map(function(it){ return it.q + (it.result==="fail" ? " \u2014 FAILED" : " \u2014 WARNING") + (it.remarks ? ": " + it.remarks : ""); });
  if(STATE.offlineSimulated){
    STATE.queue.push({ id:uid("Q", STATE.queue), type:"inspection-submission", inspectionId:ins.id, summary:draft.summary, findings:findings, gps:draft.gps, attachments:draft.attachments, queuedAt:nowISO() });
    ins.status = "In Progress";
    addAudit("Queued inspection offline", "Inspection", ins.id, "Pending");
    saveState(); navigate("inspections");
    toast("Inspection queued locally. It will be sent when you sync.","warning","Saved offline");
    return;
  }
  ins.status = "Completed"; ins.completedAt = nowISO(); ins.findings = findings; ins.summary = draft.summary;
  ins.gps = draft.gps || null; ins.attachments = draft.attachments || [];
  STATE.inspectionDraft = null;
  if(fails > 0){
    var newV = { id:uid("V", STATE.violations), mineId:ins.mineId, severity: fails >= 3 ? "Critical" : fails >= 2 ? "High" : "Medium", category:"Inspection Finding", status:"Open", date: nowISO().slice(0,10), recurrence:false, responsible: (arr(STATE.contractors).filter(function(c){ return normId(c.mineId)===normId(ins.mineId); })[0]||{}).id || null, correctiveActionId:null, evidenceState:"Not Submitted", description: fails + " checklist item(s) failed during inspection " + ins.id + "." };
    STATE.violations.unshift(newV);
    ins.linkedViolationId = newV.id;
  }
  recalcMineRisk(ins.mineId);
  addAudit("Completed inspection", "Inspection", ins.id, "Success");
  addNotification("Inspection completed", ins.id + " at " + getMineName(ins.mineId) + " has been completed.", null);
  saveState(); navigate("inspections");
  resultOk("Inspection " + ins.id + " submitted. " + fails + " failed and " + warns + " warning item(s) recorded.");
}

function acknowledgeAlert(alertId){
  var guard = requirePermission("alerts.acknowledge");
  if(!guard.ok){ resultFail(guard.error); return; }
  var a = getAlert(alertId);
  if(!a){ resultFail("That alert does not exist."); return; }
  if(a.status !== "Unacknowledged"){ resultFail("This alert has already been acknowledged."); return; }
  a.status = "Acknowledged";
  addAudit("Acknowledged alert", "Alert", a.id, "Success");
  saveState(); render();
  resultOk("Alert " + a.id + " acknowledged.");
}

function evaluateClosure(alertId){
  var a = getAlert(alertId);
  if(!a) return { ok:false, error:"That alert does not exist." };
  if(a.status === "Resolved") return { ok:false, error:"This alert is already resolved." };
  if(!a.correctiveActionId) return { ok:false, error:"No corrective action is linked to this alert. Raise a corrective action first." };
  var ca = getAction(a.correctiveActionId);
  if(!ca) return { ok:false, error:"The linked corrective action record is missing. Raise a corrective action first." };
  if(ca.status === "Completed"){
    var evDone = evidenceForAction(ca.id).filter(function(e){ return e.verificationStatus === "verified"; });
    if(!evDone.length) return { ok:false, error:"The corrective action is marked complete but has no verified evidence. Verified evidence is required." };
    return { ok:true, correctiveAction:ca };
  }
  var ev = evidenceForAction(ca.id);
  if(!ev.length) return { ok:false, error:"No evidence has been submitted for corrective action " + ca.id + ". Verified evidence is required before this alert can be closed." };
  var rejected = ev.filter(function(e){ return e.verificationStatus === "rejected"; });
  var pending = ev.filter(function(e){ return e.verificationStatus === "pending"; });
  var verified = ev.filter(function(e){ return e.verificationStatus === "verified"; });
  if(verified.length) return { ok:true, correctiveAction:ca };
  if(pending.length) return { ok:false, error:"Evidence for " + ca.id + " is pending verification. An authorised verifier must verify it before closure." };
  if(rejected.length) return { ok:false, error:"All evidence for " + ca.id + " was rejected. New verified evidence is required. Reason: " + (rejected[0].rejectionReason || "not stated") + "." };
  return { ok:false, error:"Verified evidence is required before this alert can be closed." };
}

function resolveAlert(alertId){
  var guard = requirePermission("alerts.resolve");
  if(!guard.ok){ resultFail(guard.error); return; }
  var a = getAlert(alertId);
  if(!a){ resultFail("That alert does not exist."); return; }
  var check = evaluateClosure(alertId);
  if(!check.ok){ resultFail(check.error); return; }
  a.status = "Resolved"; a.resolvedAt = nowISO();
  var ca = check.correctiveAction;
  if(ca && ca.status !== "Completed"){ ca.status = "Completed"; ca.progress = 100; ca.completedAt = nowISO(); }
  if(a.violationId){ var v = getViolation(a.violationId); if(v){ v.status = "Closed"; v.evidenceState = "Verified"; } }
  recalcMineRisk(a.mineId);
  addAudit("Resolved alert", "Alert", a.id, "Success");
  addNotification("Alert resolved", a.id + " at " + getMineName(a.mineId) + " was closed after verified evidence.", null);
  saveState(); render();
  resultOk("Alert " + a.id + " resolved. Verified evidence recorded.");
}

function submitEvidence(actionId, fileName, fileType){
  var guard = requirePermission("evidence.submit");
  if(!guard.ok){ resultFail(guard.error); return; }
  var ca = getAction(actionId);
  if(!ca){ resultFail("Select a valid corrective action."); return; }
  if(SESSION.role === "contractor" && !ownsContractor(ca.responsible)){
    resultFail("This corrective action is assigned to another contractor. You can only submit evidence for your own actions.");
    return;
  }
  if(!fileName || !String(fileName).trim()){ resultFail("Choose a file to attach as evidence."); return; }
  var ev = { id:uid("EV", STATE.evidence), fileName: String(fileName).slice(0,180), fileType: fileType || "application/octet-stream", submittedAt: nowISO(), submittedBy: ca.responsible || (SESSION.contractorId || SESSION.userId), correctiveActionId: ca.id, violationId: ca.violationId || null, verificationStatus: "pending", verifiedBy: null, verifiedAt: null, rejectionReason: null };
  STATE.evidence.unshift(ev);
  if(ca.status === "Pending") ca.status = "In Progress";
  ca.progress = Math.max(ca.progress || 0, 55);
  var v = ca.violationId ? getViolation(ca.violationId) : null;
  if(v) v.evidenceState = "Submitted";
  addAudit("Submitted evidence", "Evidence", ev.id, "Success");
  addNotification("Evidence submitted", ev.fileName + " was submitted for " + ca.id + " and awaits verification.", null);
  saveState(); closeModal(); render();
  resultOk("Evidence submitted for " + ca.id + ". It now awaits verification.");
}

function verifyEvidence(evidenceId, decision, reason){
  var guard = requirePermission("evidence.verify");
  if(!guard.ok){ resultFail(guard.error); return; }
  var ev = getEvidence(evidenceId);
  if(!ev){ resultFail("That evidence record does not exist."); return; }
  if(decision !== "verified" && decision !== "rejected"){ resultFail("Choose either Verify or Reject."); return; }
  if(SESSION.role === "contractor"){ resultFail("Contractors cannot verify evidence. An inspector, manager or regulator must verify it."); return; }
  if(ownsContractor(ev.submittedBy)){ resultFail("You cannot verify evidence submitted by your own firm."); return; }
  if(ev.verificationStatus !== "pending"){ resultFail("This evidence has already been reviewed (" + ev.verificationStatus + ")."); return; }
  if(decision === "rejected" && !String(reason||"").trim()){ resultFail("Enter a rejection reason so the contractor can correct the submission."); return; }
  ev.verificationStatus = decision;
  ev.verifiedBy = SESSION.name; ev.verifiedAt = nowISO();
  ev.rejectionReason = decision === "rejected" ? String(reason).trim() : null;
  var ca = getAction(ev.correctiveActionId);
  if(ca){
    var v = ca.violationId ? getViolation(ca.violationId) : null;
    if(decision === "verified"){ ca.progress = 100; if(v) v.evidenceState = "Verified"; }
    else { ca.progress = Math.max(0, (ca.progress||0) - 20); if(v) v.evidenceState = "Rejected"; }
  }
  addAudit(decision === "verified" ? "Verified evidence" : "Rejected evidence", "Evidence", ev.id, "Success");
  addNotification("Evidence " + decision, ev.fileName + " was " + decision + ".", "contractor");
  saveState(); closeModal(); render();
  resultOk("Evidence " + ev.id + " marked as " + decision + ".");
}

function createViolation(data){

  STATE.violations.unshift(v);
  recalcMineRisk(v.mineId);
  addAudit("Recorded violation", "Violation", v.id, "Success");
  addNotification("Violation recorded", v.id + " (" + v.severity + ") at " + getMineName(v.mineId) + ".", "manager");
  saveState(); closeModal(); render();
  resultOk("Violation " + v.id + " recorded.");
}

function createCorrectiveAction(data){
  var guard = requirePermission("actions.create");
  if(!guard.ok){ resultFail(guard.error); return; }
  if(!data.mineId){ resultFail("Select the mine for this corrective action."); return; }
  if(!data.problem || !data.problem.trim()){ resultFail("Enter the problem statement."); return; }
  if(!data.requiredAction || !data.requiredAction.trim()){ resultFail("Enter the required action."); return; }
  if(!data.deadline){ resultFail("Set a deadline for this action."); return; }
  var ca = { id:uid("CA", STATE.correctiveActions), mineId:data.mineId, violationId:data.violationId||null, alertId:data.alertId||null, problem:data.problem.trim(), requiredAction:data.requiredAction.trim(), responsible:data.responsible||null, deadline:data.deadline, severity:data.severity||"Medium", evidenceRequired:true, status:"Pending", progress:0 };
  STATE.correctiveActions.unshift(ca);
  if(data.violationId){ var v = getViolation(data.violationId); if(v) v.correctiveActionId = ca.id; }
  if(data.alertId){ var a = getAlert(data.alertId); if(a) a.correctiveActionId = ca.id; }
  recalcMineRisk(ca.mineId);
  addAudit("Created corrective action", "Corrective Action", ca.id, "Success");
  addNotification("Corrective action raised", ca.id + " at " + getMineName(ca.mineId) + ", due " + fmtDate(ca.deadline) + ".", "contractor");
  saveState(); closeModal(); render();
  resultOk("Corrective action " + ca.id + " created.");
}

function syncQueue(){
  if(!arr(STATE.queue).length){ toast("There is nothing queued to synchronise.","info"); return; }
  if(STATE.offlineSimulated){ resultFail("Turn off offline mode before synchronising queued work."); return; }
  var n = STATE.queue.length;
  STATE.queue.forEach(function(q){
    if(q.type === "inspection-submission"){
      var ins = getInspector(q.inspectionId);
      if(ins){ ins.status = "Completed"; ins.completedAt = nowISO(); ins.findings = q.findings; ins.summary = q.summary; ins.gps = q.gps || null; ins.attachments = q.attachments || []; recalcMineRisk(ins.mineId); }
    }
  });
  STATE.queue = [];
  addAudit("Synchronised queued work", "Offline Queue", n + " record(s)", "Success");
  saveState(); render();
  resultOk(n + " queued record(s) synchronised into local state.");
}

  }

    var cls = e.verificationStatus==="verified"?"success":e.verificationStatus==="rejected"?"danger":"warning";

    }
    return ['<span class="td-strong">'+esc(e.fileName)+'</span><div class="td-muted">'+esc(e.id)+'</div>'+actions, esc(getContractorName(e.submittedBy)), '<span class="nowrap td-muted">'+esc(fmtDateTime(e.submittedAt))+'</span>', '<span class="badge badge--'+cls+'">'+esc(e.verificationStatus)+'</span>', esc(e.verifiedBy || "\u2014"), esc(e.rejectionReason || "\u2014")];
  });
  body += '<div class="card"><div class="card__head"><h3 class="card__title">Evidence</h3></div><div class="card__body card__body--flush">'+
    (ev.length ? table(["Evidence","Submitted by","Submitted","Status","Verified by","Reason"], evRows) : '<div class="empty" style="padding:24px"><p>No evidence has been submitted for this corrective action.</p></div>')+
  '</div></div>';
  if(!closure.ok){
    body += '<div class="alertbox alertbox--warning mt4">'+icon("alert",18)+'<div><strong>Closure is currently blocked</strong>'+esc(closure.error)+'</div></div>';
  } else {
    body += '<div class="alertbox alertbox--success mt4">'+icon("check",18)+'<div><strong>Closure requirements met</strong>Verified evidence is recorded against '+esc(ca.id)+'.</div></div>';
  }

  if(canResolve && a.status !== "Resolved") footer += '<button type="button" class="btn btn--primary" data-act="resolve-alert" data-id="'+esc(a.id)+'"'+(closure.ok?"":" disabled aria-disabled=\"true\"")+'>Resolve Alert</button>';

function performSearch(q){
  var query = String(q||"").trim().toLowerCase();
  if(query.length < 2) return [];
  var groups = [];
  function push(label, items, view, idKey, titleKey, subKey){
    if(!items.length) return;
    groups.push({ label: label, items: items.slice(0,5).map(function(it){ return { id: it[idKey], view: view, title: String(it[titleKey]||""), sub: subKey ? String(it[subKey]||"") : "" }; }) });
  }
  push("Mines", arr(STATE.mines).filter(function(m){ return (m.id+" "+m.name+" "+m.operator+" "+m.district+" "+m.state).toLowerCase().indexOf(query) !== -1; }), "mine-detail", "id", "name", "operator");
  push("Inspections", arr(STATE.inspections).filter(function(i){ return (i.id+" "+i.type+" "+i.assignedTo+" "+getMineName(i.mineId)).toLowerCase().indexOf(query) !== -1; }), "inspections", "id", "id", "type");
  push("Violations", arr(STATE.violations).filter(function(v){ return (v.id+" "+v.category+" "+v.description+" "+v.severity).toLowerCase().indexOf(query) !== -1; }), "violations", "id", "id", "category");
  push("Alerts", arr(STATE.alerts).filter(function(a){ return (a.id+" "+a.source+" "+a.description+" "+a.severity).toLowerCase().indexOf(query) !== -1; }), "alerts", "id", "id", "source");
  push("Corrective Actions", arr(STATE.correctiveActions).filter(function(c){ return (c.id+" "+c.problem+" "+c.requiredAction).toLowerCase().indexOf(query) !== -1; }), "actions", "id", "id", "problem");
  push("Contractors", arr(STATE.contractors).filter(function(c){ return (c.id+" "+c.name+" "+c.contact).toLowerCase().indexOf(query) !== -1; }), "contractor-detail", "id", "name", "contact");
  var rep = arr(STATE.importedReports).filter(function(r){ return (r.title+" "+r.senderName+" "+r.fileName).toLowerCase().indexOf(query) !== -1; });
  if(rep.length) groups.push({ label:"Imported Reports", items: rep.slice(0,4).map(function(r){ return { id:r.id, view:"reports", title:r.title, sub:r.fileName }; })});
  return groups;
}
function renderSearchResults(groups){
  var el = byId("search-results"), input = byId("global-search");
  if(!el || !input) return;
  if(!groups.length){
    el.innerHTML = '<div class="empty" style="padding:24px"><p>No results found. Try a different term.</p></div>';
    el.style.display = "block"; input.setAttribute("aria-expanded","true"); return;
  }
  el.innerHTML = groups.map(function(g){
    return '<div class="searchresults__group"><div class="searchresults__label">'+esc(g.label)+'</div>'+
      g.items.map(function(it){
        return '<button type="button" class="searchresults__item" role="option" data-act="search-go" data-view="'+esc(it.view)+'" data-id="'+esc(it.id)+'"><strong>'+esc(it.title)+'</strong><span>'+esc(it.id)+(it.sub?" \u00b7 "+esc(it.sub):"")+'</span></button>';
      }).join("")+'</div>';
  }).join("");
  el.style.display = "block"; input.setAttribute("aria-expanded","true");
}
function hideSearchResults(){
  var el = byId("search-results"), input = byId("global-search");
  if(el) el.style.display = "none";
  if(input) input.setAttribute("aria-expanded","false");
}

  addAudit("Exported "+kind+" (CSV)", "Export", kind, "Success"); saveState();
  resultOk(kind.charAt(0).toUpperCase()+kind.slice(1)+" exported as CSV.");

function handleAction(act, el){
  switch(act){
    case "fill-cred": { var u = el.getAttribute("data-user"); var uu = USERS.filter(function(x){ return x.username === u; })[0]; if(uu){ byId("login-user").value = uu.username; byId("login-pass").value = uu.password; } break; }
    case "nav": navigate(el.getAttribute("data-view"), el.getAttribute("data-id"), el.getAttribute("data-filter")); break;
    case "logout": confirmDialog("Sign out","You will be returned to the sign-in screen. Demo data is preserved.","Sign out", logout, false); break;
    case "open-sidebar": STATE.sidebarOpen = true; render(); break;
    case "close-sidebar": STATE.sidebarOpen = false; render(); break;
    case "toggle-notifications": STATE.notifOpen = !STATE.notifOpen; render(); break;
    case "mark-all-read": visibleNotifications().forEach(function(n){ n.read = true; }); saveState(); render(); resultOk("All notifications marked as read."); break;
    case "read-notification": { var n = arr(STATE.notifications).filter(function(x){ return x.id === el.getAttribute("data-id"); })[0]; if(n && !n.read){ n.read = true; saveState(); render(); } break; }
    case "toggle-offline":
      STATE.offlineSimulated = !STATE.offlineSimulated;
      saveState(); render();
      toast(STATE.offlineSimulated ? "Offline mode enabled. Field submissions will be queued locally." : "Offline mode disabled. You can synchronise queued work now.", STATE.offlineSimulated ? "warning" : "success");
      break;
    case "modal-close": closeModal(); break;
    case "switch-tab":
      (function(){
        var tabs = document.querySelectorAll(".tab");
        for(var i=0;i<tabs.length;i++){ tabs[i].classList.remove("is-active"); tabs[i].setAttribute("aria-selected","false"); }
        el.classList.add("is-active"); el.setAttribute("aria-selected","true");
        var panels = document.querySelectorAll(".tabpanel");
        for(var j=0;j<panels.length;j++) panels[j].hidden = true;
        var target = byId(el.getAttribute("data-tab"));
        if(target) target.hidden = false;
      })();
      break;
    case "open-alert": openAlertModal(el.getAttribute("data-id")); break;
    case "open-violation": openViolationModal(el.getAttribute("data-id")); break;
    case "open-action": openActionModal(el.getAttribute("data-id")); break;
    case "acknowledge-alert": acknowledgeAlert(el.getAttribute("data-id")); closeModal(); break;
    case "resolve-alert": resolveAlert(el.getAttribute("data-id")); closeModal(); break;
    case "verify-evidence": {
      var evId = el.getAttribute("data-id");
      var decision = el.getAttribute("data-decision");
      if(decision === "rejected"){
        openModal({ title:"Reject Evidence", body:'<div class="field"><label for="rej-reason">Rejection reason</label><textarea id="rej-reason" required placeholder="Explain what is wrong so the contractor can correct it"></textarea><span class="err">A rejection reason is required.</span></div>',
          footer:'<button type="button" class="btn btn--secondary" data-act="modal-close">Cancel</button><button type="button" class="btn btn--danger" id="rej-confirm">Reject Evidence</button>' });
        var rb = byId("rej-confirm");
        if(rb) rb.addEventListener("click", function(){
          var r = byId("rej-reason");
          if(!r.value.trim()){ r.closest(".field").classList.add("is-invalid"); resultFail("Enter a rejection reason."); return; }
          verifyEvidence(evId, "rejected", r.value);
        });
      } else { verifyEvidence(evId, "verified"); }
      break;
    }
    case "submit-evidence": openSubmitEvidenceModal(el.getAttribute("data-id")); break;
    case "new-violation": openNewViolationModal(); break;
    case "new-action": openNewActionModal({ violationId: el.getAttribute("data-violation") || null, mineId: el.getAttribute("data-mine") || null, responsible: el.getAttribute("data-responsible") || null }); break;
    case "new-inspection": openNewInspectionModal(); break;
    case "start-inspection": {
      var id = el.getAttribute("data-id");
      if(id){ startInspection(id); break; }
      var open = arr(STATE.inspections).filter(function(i){ return i.status !== "Completed"; })[0];
      if(open) startInspection(open.id);
      else openNewInspectionModal();
      break;
    }
    case "save-inspection-draft":
      saveInspectionDraftFromDOM(el.getAttribute("data-id"));
      addAudit("Saved inspection draft", "Inspection", el.getAttribute("data-id"), "Success");
      saveState();
      resultOk("Draft saved locally for " + el.getAttribute("data-id") + ".");
      break;
    case "submit-inspection": submitInspection(el.getAttribute("data-id")); break;
    case "capture-gps": {
      if(!navigator.geolocation){ toast("This browser does not provide location services. GPS is optional in the demo.","warning","Location unavailable"); break; }
      var draft0 = STATE.inspectionDraft || saveInspectionDraftFromDOM(STATE.params.id);
      navigator.geolocation.getCurrentPosition(function(pos){
        draft0.gps = { lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy };
        STATE.inspectionDraft = draft0;
        var s = byId("gps-status");
        if(s) s.innerHTML = '<span class="badge badge--success">GPS captured</span> <span class="muted">'+esc(pos.coords.latitude.toFixed(4))+', '+esc(pos.coords.longitude.toFixed(4))+'</span>';
        resultOk("GPS location captured.");
      }, function(){
        var s2 = byId("gps-status");
        if(s2) s2.innerHTML = '<span class="badge badge--warning">Location not available</span> <span class="muted">You can continue without GPS.</span>';
        toast("Location permission was not granted. You can continue without GPS.","warning","Location unavailable");
      }, { timeout:9000 });
      break;
    }
    case "attach-evidence": {
      var draft1 = STATE.inspectionDraft || saveInspectionDraftFromDOM(STATE.params.id);
      var inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.csv,.txt,.json";
      inp.addEventListener("change", function(){
        if(!inp.files || !inp.files.length) return;
        var f = inp.files[0];
        if(f.size > 25*1024*1024){ resultFail("That file is larger than 25 MB."); return; }
        draft1.attachments = arr(draft1.attachments);
        draft1.attachments.push({ name:f.name.slice(0,160), type:f.type, size:f.size });
        STATE.inspectionDraft = draft1;
        var s = byId("attach-status");
        if(s) s.innerHTML = draft1.attachments.map(function(a){ return '<div class="badge badge--info" style="margin:2px 4px 2px 0">'+esc(a.name)+'</div>'; }).join("");
        resultOk("Evidence attached: " + f.name);
      });
      inp.click();
      break;
    }
    case "import-report": openImportReportModal(); break;
    case "view-import-meta": openImportMetaModal(el.getAttribute("data-id")); break;
    case "remove-import": {
      var rid = el.getAttribute("data-id");
      var rec2 = arr(STATE.importedReports).filter(function(x){ return x.id === rid; })[0];
      if(!rec2){ resultFail("That imported report no longer exists."); break; }
      confirmDialog("Remove imported report", "\u201C"+rec2.title+"\u201D will be removed from the imported reports list. This cannot be undone.", "Remove report", function(){
        STATE.importedReports = arr(STATE.importedReports).filter(function(x){ return x.id !== rid; });
        addAudit("Removed imported report", "Imported Report", rid, "Success");
        saveState(); render();
        resultOk("Imported report removed.");
      }, true);
      break;
    }
    case "view-report": viewReport(el.getAttribute("data-report")); break;
    case "export-report-json": exportReportJSON(el.getAttribute("data-report")); break;
    case "export-report-csv": exportReportCSV(el.getAttribute("data-report")); break;
    case "print-report": printReport(el.getAttribute("data-report")); break;
    case "sync-now": syncQueue(); break;
    case "reset-demo":
      confirmDialog("Reset demo data","This restores all seeded mines, inspections, violations, alerts and corrective actions. Any changes you made in this browser will be lost.","Reset demo data", resetDemo, true);
      break;
    case "search-go": {
      hideSearchResults();
      var inp2 = byId("global-search");
      if(inp2) inp2.value = "";
      navigate(el.getAttribute("data-view"), el.getAttribute("data-id"));
      break;
    }
    case "export-mines": exportMinesCSV(); break;
    case "export-mine": exportMineDetailCSV(el.getAttribute("data-id")); break;
    case "export-inspections": exportInspectionCSV(); break;
    case "export-violations": exportViolationCSV(); break;
    case "export-alerts": exportAlertCSV(); break;
    case "export-actions": exportActionCSV(); break;
    case "export-contractors": exportContractorCSV(); break;
    case "export-certs": exportCertCSV(); break;
    case "export-documents": exportDocumentCSV(); break;
    case "export-audit": exportAuditCSV(); break;
    case "export-compliance": exportComplianceCSV(); break;
    case "export-portfolio": exportPortfolioJSON(); break;
    case "print-compliance": {
      var body = '<h1>Compliance Summary</h1><p class="muted">Generated '+esc(fmtDateTime(nowISO()))+'</p>'+
        '<table><thead><tr><th>Mine</th><th>Compliance</th><th>Band</th><th>Open violations</th></tr></thead><tbody>'+
        arr(STATE.mines).map(function(m){ var sc = computeCompliance(m.id); var ov = arr(STATE.violations).filter(function(v){ return normId(v.mineId)===normId(m.id) && v.status!=="Closed"; }).length; return '<tr><td>'+esc(m.name)+'</td><td>'+sc+'%</td><td>'+esc(complianceBand(sc).label)+'</td><td>'+ov+'</td></tr>'; }).join("")+
        '</tbody></table>';
      printSummary("Compliance Summary", body);
      break;
    }
    case "clear-mine-filters": STATE.filters.mines = { q:"", risk:"", status:"" }; render(); break;
    case "clear-cert-filters": STATE.filters.certs = { q:"", status:"" }; render(); break;
    case "clear-audit-filters": STATE.filters.audit = { q:"", role:"" }; render(); break;
    case "clear-filter": STATE.params.filter = null; render(); break;
    case "map-pin": navigate("mine-detail", el.getAttribute("data-id")); break;
    default: break;
  }
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(act === "modal-backdrop" && e.target !== el) return;
  if(act === "modal-backdrop"){ closeModal(); return; }
  if(el.tagName === "BUTTON" && el.type === "submit") return;
  e.preventDefault();
  try { handleAction(act, el); } catch(err){ toast("Something went wrong with that action. Please try again.","error"); }
});

document.addEventListener("submit", function(e){
  if(e.target.id === "login-form"){
    e.preventDefault();
    var u = byId("login-user"), p = byId("login-pass");
    var uf = byId("f-user"), pf = byId("f-pass");
    uf.classList.remove("is-invalid"); pf.classList.remove("is-invalid");
    var err = byId("login-error"); err.style.display = "none";
    var bad = false;
    if(!u.value.trim()){ uf.classList.add("is-invalid"); bad = true; }
    if(!p.value){ pf.classList.add("is-invalid"); bad = true; }
    if(bad){ err.style.display = "flex"; err.innerHTML = "<div><strong>Sign-in incomplete</strong>Enter both your username and password.</div>"; return; }
    var btn = byId("login-submit");
    if(btn) btn.disabled = true;
    var res = login(u.value, p.value);
    if(btn) btn.disabled = false;
    if(!res.ok){ err.style.display = "flex"; err.innerHTML = "<div><strong>Sign-in failed</strong>"+esc(res.error)+"</div>"; return; }
    render();
    toast(res.message,"success","Signed in");
  }
});

document.addEventListener("input", function(e){
  var key = e.target.getAttribute && e.target.getAttribute("data-filterkey");
  if(key){
    var parts = key.split(".");
    STATE.filters[parts[0]] = STATE.filters[parts[0]] || {};
    STATE.filters[parts[0]][parts[1]] = e.target.value;
    var pos = e.target.selectionStart, id = e.target.id;
    render();
    var again = byId(id);
    if(again && again.tagName === "INPUT"){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(x){} }
    saveState();
    return;
  }
  if(e.target.id === "global-search"){
    var groups = performSearch(e.target.value);
    if(String(e.target.value).trim().length < 2){ hideSearchResults(); return; }
    renderSearchResults(groups);
  }
});

document.addEventListener("change", function(e){
  var key = e.target.getAttribute && e.target.getAttribute("data-filterkey");
  if(key){
    var parts = key.split(".");
    STATE.filters[parts[0]] = STATE.filters[parts[0]] || {};
    STATE.filters[parts[0]][parts[1]] = e.target.value;
    render();
    saveState();
  }
  if(e.target.getAttribute && e.target.getAttribute("data-chk") !== null){
    STATE.inspectionDraft = STATE.inspectionDraft || saveInspectionDraftFromDOM(STATE.params.id);
  }
});

document.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    var inp = byId("global-search");
    if(inp){ inp.focus(); inp.select(); }
    return;
  }
  if(e.key === "Escape"){
    hideSearchResults();
    if(STATE.notifOpen){ STATE.notifOpen = false; render(); }
  }
  if(e.key === "Enter" && e.target && e.target.classList && e.target.classList.contains("mapmarker")){
    e.preventDefault();
    navigate("mine-detail", e.target.getAttribute("data-id"));
  }
});

document.addEventListener("focusout", function(e){
  var box = byId("searchbox");
  if(box && !box.contains(e.relatedTarget)) hideSearchResults();
});

window.addEventListener("beforeunload", function(){ saveState(); });

function runDiagnostics(){
  var issues = [], ids = {};
  var all = document.querySelectorAll("[id]");
  for(var i=0;i<all.length;i++){ var id = all[i].id; if(ids[id]) issues.push("Duplicate ID: " + id); ids[id] = true; }
  arr(STATE.violations).forEach(function(v){ if(v.mineId && !getMine(v.mineId)) issues.push("Violation " + v.id + " references missing mine " + v.mineId); if(v.correctiveActionId && !getAction(v.correctiveActionId)) issues.push("Violation " + v.id + " references missing action " + v.correctiveActionId); });
  arr(STATE.alerts).forEach(function(a){ if(a.mineId && !getMine(a.mineId)) issues.push("Alert " + a.id + " references missing mine " + a.mineId); if(a.correctiveActionId && !getAction(a.correctiveActionId)) issues.push("Alert " + a.id + " references missing action " + a.correctiveActionId); });
  arr(STATE.correctiveActions).forEach(function(c){ if(c.mineId && !getMine(c.mineId)) issues.push("Action " + c.id + " references missing mine " + c.mineId); if(c.responsible && !getContractor(c.responsible)) issues.push("Action " + c.id + " references missing contractor " + c.responsible); });
  return issues;
}

function init(){
  loadState();
  STATE.offlineSimulated = STATE.offlineSimulated || false;
  STATE.sidebarOpen = false;
  STATE.notifOpen = false;
  STATE.view = "dashboard";
  STATE.params = {};
  STATE.filters = STATE.filters || {};
  STATE.queue = arr(STATE.queue);
  STATE.importedReports = arr(STATE.importedReports);
  recalcAllRisk();
  SESSION = loadSession();
  render();
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

return { version:"1.0.0", state:function(){ return STATE; }, session:function(){ return SESSION; }, diagnostics:runDiagnostics, can:can };
})();
</script>
</body>
</html>
